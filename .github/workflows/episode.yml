name: Make episode

# Three reels a day: 8:30 AM, 12:30 PM and 5:30 PM Pacific. GitHub cron is UTC with
# no DST, so each slot has a PDT trigger and a PST trigger; the "when" step keeps
# only the one matching today's Pacific offset (works even if GitHub starts late).
on:
  schedule:
    - cron: "30 15 * * *"   # 8:30 AM PDT
    - cron: "30 16 * * *"   # 8:30 AM PST
    - cron: "30 19 * * *"   # 12:30 PM PDT
    - cron: "30 20 * * *"   # 12:30 PM PST
    - cron: "30 0 * * *"    # 5:30 PM PDT
    - cron: "30 1 * * *"    # 5:30 PM PST
  workflow_dispatch:
    inputs:
      title:
        description: "Story headline (leave empty to let the picker choose)"
        required: false
      urls:
        description: "Source URLs, space-separated (needed with title; at least two)"
        required: false
      mode:
        description: "news = make a fresh episode; queue = post the next ready episode from queue/"
        required: false
        default: news

permissions:
  contents: write
  issues: write

concurrency:
  group: episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    # Same image the renderer was verified in (Debian bookworm: ffmpeg + fonts-inter at the path render_reel.py expects).
    container: python:3.12-slim-bookworm
    timeout-minutes: 45
    steps:
      - name: Check schedule matches Pacific time
        id: when
        shell: bash
        run: |
          offset=$(TZ=America/Los_Angeles date +%z)   # -0700 or -0800
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 15 * * *"|"30 19 * * *"|"30 0 * * *") [ "$offset" = "-0700" ] || run=false ;;
              "30 16 * * *"|"30 20 * * *"|"30 1 * * *") [ "$offset" = "-0800" ] || run=false ;;
            esac
          fi
          # Money Lab: the 12:30 PM slot on Tuesdays and Fridays posts from the queue.
          mode="${{ inputs.mode || 'news' }}"
          dow=$(TZ=America/Los_Angeles date +%u)   # 2 = Tue, 5 = Fri
          case "${{ github.event.schedule }}" in
            "30 19 * * *"|"30 20 * * *") { [ "$dow" = 2 ] || [ "$dow" = 5 ]; } && mode=queue ;;
          esac
          echo "Pacific offset $offset, run=$run, mode=$mode"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        if: steps.when.outputs.run == 'true'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ffmpeg fonts-inter curl ca-certificates >/dev/null

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'

      - name: Cache voice models
        if: steps.when.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: voices
          key: voices-piper-lessac-kokoro-v1

      - name: Setup (Python packages + voice)
        if: steps.when.outputs.run == 'true'
        run: bash setup.sh

      # ---------- news episode (any failure here falls back to the queue) ----------
      - name: Pick story
        id: pick
        if: steps.when.outputs.run == 'true' && steps.when.outputs.mode == 'news' && inputs.title == ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.A_API_KEY }}
        run: python pick_story.py --out "$RUNNER_TEMP/story.json"

      - name: Generate episode
        if: steps.when.outputs.run == 'true' && steps.when.outputs.mode == 'news' && (inputs.title != '' || steps.pick.outcome == 'success')
        id: gen
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.A_API_KEY }}
          TITLE: ${{ inputs.title }}
          URLS: ${{ inputs.urls }}
        run: |
          if [ -n "$TITLE" ]; then
            args=(--title "$TITLE"); for u in $URLS; do args+=(--url "$u"); done
          else
            args=(--story "$RUNNER_TEMP/story.json")
          fi
          dir=$(python make_episode.py "${args[@]}" --date "$(TZ=America/Los_Angeles date +%F)" --print-dir)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dir")" >> "$GITHUB_OUTPUT"

      - name: Render reel
        id: render
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python render_reel.py "${{ steps.gen.outputs.dir }}/script.json" --voice kokoro:af_heart
          python - "${{ steps.gen.outputs.dir }}/render_report.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          d = r["duration_sec"]
          if not 30 <= d <= 35:
              print(f"::warning::reel is {d} sec, outside the 30-35 sec target")
          print(f"duration {d} sec")
          EOF
          rm -rf "${{ steps.gen.outputs.dir }}/_work"

      - name: Upload reel
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gen.outputs.name }}
          path: |
            ${{ steps.gen.outputs.dir }}/reel.mp4
            ${{ steps.gen.outputs.dir }}/thumbnail.png
            ${{ steps.gen.outputs.dir }}/posts.md

      - name: Commit episode
        if: steps.render.outcome == 'success'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python export_blog.py "${{ steps.gen.outputs.dir }}"
          git add "episodes/${{ steps.gen.outputs.name }}" blog
          git commit -m "Episode: ${{ steps.gen.outputs.name }}" \
                     -m "Generated by the scheduled pipeline." \
                     -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push

      # Auto-publish: runs only when the repo variable AUTO_PUBLISH is "true".
      # publish_instagram.py refuses to post unless its safety gate passes.
      - name: Publish to Instagram
        id: publish
        if: steps.render.outcome == 'success' && vars.AUTO_PUBLISH == 'true'
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINK_IN_BIO: ${{ vars.LINK_IN_BIO }}
        run: |
          python publish_instagram.py "${{ steps.gen.outputs.dir }}"
          python export_blog.py "${{ steps.gen.outputs.dir }}"
          git add "${{ steps.gen.outputs.dir }}" blog
          git commit -m "Published to Instagram: ${{ steps.gen.outputs.name }}" \
                     -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push

      # ---------- queue: Money Lab slots, or fallback when no news episode was made ----------
      - name: Post from queue
        id: queue
        if: steps.when.outputs.run == 'true' && vars.AUTO_PUBLISH == 'true' && (steps.when.outputs.mode == 'queue' || steps.render.outcome != 'success')
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINK_IN_BIO: ${{ vars.LINK_IN_BIO }}
          MODE: ${{ steps.when.outputs.mode }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin "${{ github.ref_name }}"
          prefix=""
          if [ "$MODE" = queue ] && [ -n "$(ls -d queue/moneylab-* 2>/dev/null)" ]; then prefix=moneylab-; fi
          dest=$(python post_from_queue.py --prefix "$prefix" | tail -1)
          git add -A queue episodes blog
          git commit -m "Published from queue: $(basename "$dest")" \
                     -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push

      # ---------- health: open a GitHub issue (GitHub emails the repo owner) ----------
      - name: Health check and alerts
        if: always() && steps.when.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEWS: ${{ steps.render.outcome }}
          MODE: ${{ steps.when.outputs.mode }}
          PUBLISH: ${{ steps.publish.outcome }}
          QUEUE: ${{ steps.queue.outcome }}
          JOB: ${{ job.status }}
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, subprocess, urllib.request
          env = os.environ
          ready = int(subprocess.run(["python", "post_from_queue.py", "--count"], capture_output=True, text=True).stdout.strip() or 0)
          problems = []
          if env["MODE"] == "news" and env["NEWS"] != "success" and env["QUEUE"] != "success":
              problems.append(f"Nothing posted this slot: no news episode (render: {env['NEWS'] or 'skipped'}) and no queue post.")
          if env["PUBLISH"] == "failure":
              problems.append("Publishing the news episode to Instagram failed.")
          if env["QUEUE"] == "failure":
              problems.append("Posting from the queue failed.")
          if env["JOB"] == "failure" and not problems:
              problems.append("The run failed.")
          if ready < 5:
              problems.append(f"Queue is low: {ready} ready episodes left (keep 5+ for a 15-day buffer).")
          print(f"queue ready: {ready}; problems: {problems}")
          if not problems:
              raise SystemExit(0)
          title = "Reels pipeline needs attention"
          api = f"https://api.github.com/repos/{env['REPO']}/issues"
          hdr = {"Authorization": f"Bearer {env['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          body = "\n".join(f"- {p}" for p in problems) + f"\n\nRun: {env['RUN_URL']}"
          open_issues = json.load(urllib.request.urlopen(urllib.request.Request(api + "?state=open&per_page=50", headers=hdr)))
          existing = next((i for i in open_issues if i["title"] == title), None)
          if existing:
              url, data = existing["comments_url"], {"body": body}
          else:
              url, data = api, {"title": title, "body": body}
          urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(data).encode(), headers=hdr, method="POST"))
          print("alert posted")
          EOF
